          </div>

          <div id="calOutPuts">

              <div id="calcContainer">

                   <div id="basicCal">

                        <!--screen-->
                        <div id="screen">

                              <div id="screenSecond">
                                 
                              </div>

                              <!--screenThirdSec-->
                              <div id="screenThird">
                                 
                              </div>

                        </div>
                        <!--basic Calculator Buttons-->
                        <div id="basicCalcButtons">
                            <div class="nunito btnNumber">7</div>
                            <div class="nunito btnNumber">8</div>
                            <div class="nunito btnNumber">9</div>
                            <div id="add" class="nunito">+</div>
                            <div class="nunito btnNumber">4</div>
                            <div class="nunito btnNumber">5</div>
                            <div class="nunito btnNumber">6</div>
                            <div id="subtract" class="nunito">-</div>
                            <div class="nunito btnNumber">1</div>
                            <div class="nunito btnNumber">2</div>
                            <div class="nunito btnNumber">3</div>
                            <div id="divide" class="nunito">/</div>
                            <div class="nunito btnNumber">0</div>
                            <div id="multiple" class="nunito">X</div>
                            <div id="equalTo" class="nunito">=</div>
                        </div>
                   </div>
                   <!-- full Calculator ff-->

              <!--more calculator functions-->
              <div id="moreCalcContainer">
